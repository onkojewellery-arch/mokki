  R(g,fx+46,fy+18,1,9,'#3a2c20');R(g,fx+46,fy+18,10,1,'#3a2c20');R(g,fx+62,fy+16,1,10,'#3a2c20');
  txt(g,'KESÄ -78',fx+50,fy+50,'#5a4630');for(let i=0;i<40;i++)P(g,fx+8+Math.floor(hash(i,5,96)*76),fy+8+Math.floor(hash(i,6,96)*48),'rgba(90,70,40,.18)');
});}

// ---------- kartta ja esineet ----------
const OBJ=[
  {k:'keitin',x:1,y:2,w:1,h:1,dy:2,spr:()=>SPR.keitin,hit:1},
  {k:'mandi',x:3,y:2,w:1,h:1,dy:-4,spr:()=>charSpr('mandi','down',0),hit:1},
  {k:'hylly',x:4,y:2,w:1,h:1,dy:0,spr:()=>SPR.hylly,hit:1},
  {k:'tiski',x:1,y:3,w:4,h:1,dy:4,spr:()=>SPR.counter,hit:1},
  {k:'jakkara',x:1,y:4,w:1,h:1,dy:-4,spr:()=>SPR.stool},
  {k:'jakkara',x:2,y:4,w:1,h:1,dy:-4,spr:()=>SPR.stool},
  {k:'pajatso',x:5,y:2,w:1,h:1,dy:-2,spr:()=>SPR.pajatso,hit:1},
  {k:'jukeboksi',x:8,y:2,w:1,h:1,dy:-2,spr:()=>SPR.jukebox,hit:1},
  {k:'penkki',x:8,y:4,w:1,h:3,dy:2,spr:()=>SPR.bench,hit:1},
  {k:'poyta',x:5,y:5,w:2,h:1,dy:0,spr:()=>SPR.table,hit:1},
  {k:'pikkupoyta',x:1,y:6,w:1,h:1,dy:-6,spr:()=>SPR.small,hit:1},
  {k:'tuoppi',x:1,y:6,w:1,h:1,dy:-62,z:1,spr:()=>SPR.tuoppi,eve:1,nosolid:1},
  {k:'kara',x:2,y:6,w:1,h:1,dy:-6,spr:()=>charSpr('kara','left',(Math.floor(frame/90)%7===0)?0:0),hit:1,eve:1}];
const DECOR=[{k:'lista',x:110,y:10,w:104,h:64},{k:'kuva',x:386,y:8,w:92,h:64},{k:'lamppu',x:226,y:30,w:28,h:26},{k:'lamppu',x:490,y:30,w:28,h:26},{k:'lamppu',x:40,y:352,w:28,h:26}];
const LAMPS=[[240,44,0],[504,44,0],[54,362,1]];
let evening=true,frame=0,money=50,TFX={k:0,t:0};
const PL={x:4,y:7,px:4*TS,py:7*TS,dir:'up',path:[],moving:false,step:0,after:null};
function vis(o){return !o.eve||evening;}
function solidAt(x,y){if(x<1||x>8||y<2||y>7)return !(x===4&&y===8);for(const o of OBJ)if(vis(o)&&!o.nosolid&&x>=o.x&&x<o.x+o.w&&y>=o.y&&y<o.y+o.h)return o;if(y===2&&(x===2))return true;return false;}
function bfs(goal){const sx=PL.x,sy=PL.y,Q=[[sx,sy]],prev={};prev[sx+','+sy]=null;
  while(Q.length){const [x,y]=Q.shift();if(goal(x,y)){const p=[];let k=x+','+y;while(prev[k]!==null&&prev[k]!==undefined){p.unshift(k.split(',').map(Number));k=prev[k];}return p;}
    for(const [dx,dy] of [[0,-1],[1,0],[0,1],[-1,0]]){const X=x+dx,Y=y+dy,K=X+','+Y;if(K in prev||X<0||Y<0||X>=W||Y>=H||solidAt(X,Y))continue;prev[K]=x+','+y;Q.push([X,Y]);}}return null;}
function sprPos(o){const s=o.spr();return [o.x*TS+o.w*TS/2-s.width/2,(o.y+o.h)*TS-s.height+(o.dy||0),s];}

// ---------- vuorovaikutus ----------
const dlg=document.getElementById('dlg');let DQ=[],DCH=null,dlgOpen=false,onClose=null;
function say(lines,choices,close){DQ=Array.isArray(lines)?lines.slice():[lines];DCH=choices||null;onClose=close||null;dlgOpen=true;showLine();}
function showLine(){const l=DQ[0];let h=l;if(DQ.length===1&&DCH){h+='<div class="ch">'+DCH.map((c,i)=>'<button data-i="'+i+'">'+c[0]+'</button>').join('')+'</div>';}else h+='<span class="more">▼</span>';
  dlg.innerHTML=h;dlg.style.display='block';document.getElementById('hint').style.display='none';
  dlg.querySelectorAll('button').forEach(b=>b.addEventListener('pointerdown',e=>{e.stopPropagation();e.preventDefault();const c=DCH[+b.dataset.i];DCH=null;closeDlg(true);c[1]();}));}
function advance(){if(!dlgOpen)return;if(DQ.length===1&&DCH)return;DQ.shift();if(DQ.length)showLine();else closeDlg();}
function closeDlg(silent){dlgOpen=false;dlg.style.display='none';const f=onClose;onClose=null;if(f&&!silent)f();}
dlg.addEventListener('pointerdown',e=>{e.preventDefault();advance();});
function hudUpd(){document.getElementById('hudt').innerHTML='Mandin grilli · '+money+' mk<small>64 px testi · '+(evening?'ilta':'päivä')+'</small>';document.getElementById('aika').textContent=evening?'Päivä':'Ilta';}
const TAROT=[{n:'Aurinko',t:'Tänään kannattaa tehdä yksi asia loppuun asti. Loput ehtii huomenna.',c:'#f0c040'},{n:'Kuu',t:'Kaikkea ei tarvitse tietää heti. Kuuntele, mitä naapuri kertoo.',c:'#c8d4f0'},{n:'Tähti',t:'Pieni haave on lähempänä kuin luulet. Laita markka säästöön.',c:'#f8e8a0'}];
function drawCard(t){const c=document.getElementById('cardcv'),g=c.getContext('2d');g.imageSmoothingEnabled=false;R(g,0,0,48,72,'#f4ead0');R(g,2,2,44,68,'#5a2a6a');R(g,4,4,40,64,'#2a1838');
  for(let i=0;i<30;i++)P(g,5+Math.floor(hash(i,1,97)*38),5+Math.floor(hash(i,2,97)*50),'rgba(255,240,200,.5)');
  if(t.n==='Aurinko'){ell(g,24,30,10,10,t.c);for(let a=0;a<12;a++){const x=24+Math.cos(a/12*6.28)*15,y=30+Math.sin(a/12*6.28)*15;R(g,x-1,y-1,3,3,t.c);}ell(g,24,30,6,6,'#f8e080');}
  else if(t.n==='Kuu'){ell(g,24,30,11,11,t.c);ell(g,29,27,10,10,'#2a1838');}
  else{for(const [dx,dy] of [[0,-12],[0,12],[-12,0],[12,0],[-6,-6],[6,6],[6,-6],[-6,6]])R(g,24+dx/ (Math.abs(dx)>6||Math.abs(dy)>6?1:1)-1,30+dy-1,3,3,t.c);ell(g,24,30,4,4,'#fff8d0');}
  R(g,8,56,32,8,'#f4ead0');txt(g,t.n.toUpperCase(),24-t.n.length*2,58,'#3a1a4a');}
function tarot(){TFX.t=1;say(['Mandi himmentää valot ja sytyttää tiskin kynttilät.','Hän sekoittaa pakkaa tottuneesti ja nostaa yhden kortin tiskille.'],null,()=>{
  const t=TAROT[Math.floor(Math.random()*TAROT.length)];drawCard(t);document.getElementById('cardn').textContent=t.n;document.getElementById('card').style.display='block';
  say(['”'+t.n+'.” Mandi naputtaa korttia. ”'+t.t+'”'],null,()=>{document.getElementById('card').style.display='none';TFX.t=0;});});}
function interactObj(o){if(!o)return;PL.path=[];
  switch(o.k){
    case 'mandi':case 'tiski':faceTo(3,3);return say('Mandi nojaa tiskiin. ”Kahvia, makkaraperunat vai kortti pöytään?”',[
      ['Kahvi ja munkki (2 mk)',()=>{if(money<2)return say('Rahat eivät riitä.');money-=2;hudUpd();say(['Mandi kaataa kahvia ja nostaa munkin paperille.','Munkki on vielä lämmin.']);}],
      ['Makkaraperunat (6 mk)',()=>{if(money<6)return say('Rahat eivät riitä.');money-=6;hudUpd();say(['Mandi nostaa ranskalaiset altaasta ja pilkkoo makkaran päälle.','Sinappia ja ketsuppia, juuri niin kuin pitää.']);}],
      ['Tarot-luenta',tarot],['Hei hei',()=>say('”Tervetuloa uudestaan.”')]]);
    case 'kara':return say(['Kara nostaa tuoppia. ”Iltaa! Tänään myin yhden maton.”','”Siinä oli koko päivän tulosraportti.”']);
    case 'tuoppi':return say('Karan tuoppi. Vaahto on vielä paikallaan.');
    case 'pajatso':return say(['Vanha pajatso. Markka kilahtaa naulojen välissä…','…ja putoaa ykköskuppiin. Melkein.']);
    case 'jukeboksi':return say('Jukeboksi soittaa hiljaa vanhaa iskelmää. Valot kiertävät kaarta pitkin.');
    case 'penkki':return say('Pitkä penkki seinän vierellä. Viininpunaiset pehmusteet ovat kuluneet juuri oikeista kohdista.');
    case 'poyta':return say('Pöydällä on ketsuppi, sinappi, servetit ja maljakossa yksi voikukka.');
    case 'pikkupoyta':return say(evening?'Pieni pyöreä pöytä seinävalon alla. Karan iltapaikka.':'Pieni pyöreä pöytä seinävalon alla. Illalla tässä istuu Kara.');
    case 'jakkara':return say('Punainen baarijakkara. Se pyörähtää puoli kierrosta.');
    case 'keitin':return say('Kahvinkeitin porisee ja friteeraus odottaa seuraavaa annosta.');
    case 'hylly':return say('Hyllyllä on limsapulloja, siideriä ja Mandin oma purkki: KORTTIKAHVI.');
    case 'lista':return say(['Mandin käsin kirjoittama lista:','MAKKARAPERUNAT 6 · HAMPURILAINEN 5 · KAHVI JA MUNKKI 2 · LIMSA 1 · TAROT ?']);
    case 'kuva':return say(['Vanha valokuva Vattulan venelaiturista.','Laiturilla seisoo kolme lasta onget kädessä. Kulmaan on kirjoitettu: kesä -78.']);
    case 'lamppu':return say('Pieni seinälamppu. Meripihkan värinen lasi lämmittää valon.');}}
function faceTo(x,y){const dx=x-PL.x,dy=y-PL.y;PL.dir=Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up');}
function goInteract(o){const tiles=[];for(let x=o.x;x<o.x+o.w;x++)for(let y=o.y;y<o.y+o.h;y++)tiles.push([x,y]);
  if(o.k==='mandi'||o.k==='tiski')for(let x=1;x<=4;x++)tiles.push([x,3]);
  const adj=(x,y)=>tiles.some(([tx,ty])=>Math.abs(tx-x)+Math.abs(ty-y)===1);
  if(adj(PL.x,PL.y)){const t=tiles.find(([tx,ty])=>Math.abs(tx-PL.x)+Math.abs(ty-PL.y)===1);faceTo(t[0],t[1]);interactObj(o);return;}
  const p=bfs(adj);if(!p){interactObj(o);return;}PL.path=p;PL.after=()=>{const t=tiles.find(([tx,ty])=>Math.abs(tx-PL.x)+Math.abs(ty-PL.y)===1);if(t)faceTo(t[0],t[1]);interactObj(o);};}
function hitTest(gx,gy){const list=OBJ.filter(o=>vis(o)&&o.hit!==undefined||o.k==='tuoppi'&&vis(o)).map(o=>{const [x,y,s]=sprPos(o);return {o,x,y,w:s.width,h:s.height,b:(o.y+o.h)*TS+(o.z||0)};}).sort((a,b)=>b.b-a.b);
  for(const r of list){if(gx>=r.x&&gx<r.x+r.w&&gy>=r.y&&gy<r.y+r.h){const s=r.o.spr(),px=s.getContext('2d').getImageData(Math.floor(gx-r.x),Math.floor(gy-r.y),1,1).data[3];if(px>0)return r.o;}}
  for(const d of DECOR)if(gx>=d.x&&gx<d.x+d.w&&gy>=d.y&&gy<d.y+d.h)return d;return null;}
function onTap(gx,gy){if(dlgOpen){advance();return;}
  const o=hitTest(gx,gy);if(o){if(o.x!==undefined&&o.w<=104&&o.k&&DECOR.includes(o)){interactObj(o);return;}goInteract(o);return;}
  const tx=Math.floor(gx/TS),ty=Math.floor(gy/TS);if(tx===4&&ty>=8){const p=bfs((x,y)=>x===4&&y===7);PL.path=p||[];PL.after=()=>{PL.dir='down';say('Ovesta pääsisi kylänraitille. Tässä testissä pysytään grillillä.');};return;}
  if(solidAt(tx,ty))return;const p=bfs((x,y)=>x===tx&&y===ty);if(p){PL.path=p;PL.after=null;}}
cv.addEventListener('pointerdown',e=>{e.preventDefault();const r=cv.getBoundingClientRect();onTap(Math.round(camX)+(e.clientX-r.left)*VWv/r.width,Math.round(camY)+(e.clientY-r.top)*VHv/r.height);});
document.getElementById('zoom').addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();ZOOM=!ZOOM;e.currentTarget.textContent=ZOOM?'Koko huone':'Lähennä';fit();});
document.getElementById('aika').addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();evening=!evening;hudUpd();});
addEventListener('keydown',e=>{const k=e.key;if(dlgOpen){if(k===' '||k==='Enter'||k==='z'){advance();e.preventDefault();}
    if(DCH&&DQ.length===1&&/^[1-4]$/.test(k)){const c=DCH[+k-1];if(c){DCH=null;closeDlg(true);c[1]();}}return;}
  const D={ArrowUp:[0,-1,'up'],ArrowDown:[0,1,'down'],ArrowLeft:[-1,0,'left'],ArrowRight:[1,0,'right']}[k];
  if(D&&!PL.moving){PL.dir=D[2];const X=PL.x+D[0],Y=PL.y+D[1];if(!solidAt(X,Y)&&Y<8)PL.path=[[X,Y]];e.preventDefault();}
  if(k===' '||k==='Enter'||k==='z'){const d={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]}[PL.dir];const o=solidAt(PL.x+d[0],PL.y+d[1]);if(o&&o!==true)interactObj(o);e.preventDefault();}});

// ---------- päivitys ja piirto ----------
function update(){frame++;TFX.k+=(TFX.t-TFX.k)*.06;if(Math.abs(TFX.t-TFX.k)<.002)TFX.k=TFX.t;
  if(!PL.moving&&PL.path.length){const [nx,ny]=PL.path[0];if(solidAt(nx,ny)){PL.path=[];}else{faceTo(nx,ny);PL.moving=true;PL.tx=nx;PL.ty=ny;}}
  if(PL.moving){const sp=4,gx=PL.tx*TS,gy=PL.ty*TS;PL.px+=Math.sign(gx-PL.px)*Math.min(sp,Math.abs(gx-PL.px));PL.py+=Math.sign(gy-PL.py)*Math.min(sp,Math.abs(gy-PL.py));PL.step++;
    if(PL.px===gx&&PL.py===gy){PL.x=PL.tx;PL.y=PL.ty;PL.moving=false;PL.path.shift();if(!PL.path.length&&PL.after){const f=PL.after;PL.after=null;f();}}}}
let lightC=mk(CW,CH,()=>{});
function draw(){ctx.drawImage(ground,0,0);
  const items=[];for(const o of OBJ)if(vis(o)){const [x,y,s]=sprPos(o);items.push({b:(o.y+o.h)*TS+(o.z||0),fn:()=>{if(o.k==='mandi'||o.k==='kara'){ell(ctx,x+s.width/2,(o.y+o.h)*TS-8,15,5,'rgba(0,0,0,.28)');}ctx.drawImage(s,Math.round(x),Math.round(y));
    if(o.k==='keitin'){for(let i=0;i<3;i++){const t=(frame*.5+i*20)%60;ctx.globalAlpha=.5*(1-t/60);ell(ctx,x+48+Math.sin((frame+i*30)/15)*3,y+8-t*.6,3+t/20,2+t/30,'#ffffff');}ctx.globalAlpha=1;}
    if(o.k==='mandi'&&frame%240<8){R(ctx,x+16,y+20,4,2,'#f0c4a0');R(ctx,x+26,y+20,4,2,'#f0c4a0');}
    if(o.k==='kara'&&frame%300<8){R(ctx,x+30,y+19,4,3,'#f4cfae');}}});}
  const fr=PL.moving?[1,0,3,0][Math.floor(PL.step/6)%4]:0,ps=charSpr('pelaaja',PL.dir,fr);
  items.push({b:PL.py+TS,fn:()=>{ell(ctx,PL.px+32,PL.py+TS-8,15,5,'rgba(0,0,0,.28)');ctx.drawImage(ps,Math.round(PL.px+32-ps.width/2),Math.round(PL.py+TS-ps.height-6));}});
  items.sort((a,b)=>a.b-b.b).forEach(i=>i.fn());
  for(const [lx,ly,sd] of LAMPS)ctx.drawImage(sd?SPR.lampS:SPR.lamp,sd?lx-12:lx-14,ly-14);
  // kynttilän liekit
  const ct=OBJ.find(o=>o.k==='tiski'),[cx0,cy0]=sprPos(ct);
  if(TFX.k>.02){ctx.globalAlpha=Math.min(1,TFX.k*1.5);for(const c of CANDLES){const X=cx0+1+c,Y=cy0+1+19,f=(frame>>2)%3;ell(ctx,X,Y-4-(f===1?1:0),3,5+(f===2?1:0),'#ffa828');ell(ctx,X,Y-3,2,3,'#ffe070');P(ctx,X,Y-2,'#ffffff');}ctx.globalAlpha=1;}
  // valaistus
  const amb=lerpC(evening?'#a8846a':'#f0dcc0',  '#3a2a3e',TFX.k*.85);
  const L=lightC.getContext('2d');L.globalCompositeOperation='source-over';L.fillStyle=amb;L.fillRect(0,0,CW,CH);L.globalCompositeOperation='lighter';
  const glow=(x,y,r,c,a)=>{const gr=L.createRadialGradient(x,y,0,x,y,r);gr.addColorStop(0,'rgba('+c+','+a+')');gr.addColorStop(1,'rgba('+c+',0)');L.fillStyle=gr;L.fillRect(x-r,y-r,2*r,2*r);};
  const lk=1-TFX.k*.85,la=evening?.55:.25;
  for(const [lx,ly,sd] of LAMPS)if(lk>.05)glow(sd?lx+16:lx,ly+20,sd?190:170,'255,176,96',la*lk);
  glow(288,250,160,'255,170,90',(evening?.18:.08)*lk);
  if(TFX.k>.02){const fl=Math.sin(frame*.31)*4+Math.sin(frame*.77)*2;for(const c of CANDLES)glow(cx0+1+c,cy0+16,(110+fl)*TFX.k,'255,170,80',.75*TFX.k);glow(224,118,90*TFX.k,'255,190,130',.6*TFX.k);}
  ctx.globalCompositeOperation='multiply';ctx.drawImage(lightC,0,0);ctx.globalCompositeOperation='source-over';
  // hehku lamppujen ja kynttilöiden ympärillä
  ctx.globalCompositeOperation='lighter';
  const halo=(x,y,r,c,a)=>{const gr=ctx.createRadialGradient(x,y,0,x,y,r);gr.addColorStop(0,'rgba('+c+','+a+')');gr.addColorStop(1,'rgba('+c+',0)');ctx.fillStyle=gr;ctx.fillRect(x-r,y-r,2*r,2*r);};
  for(const [lx,ly,sd] of LAMPS)halo(sd?lx+18:lx,ly+6,26,'255,200,120',(evening?.35:.15)*lk);
  if(TFX.k>.02)for(const c of CANDLES)halo(cx0+1+c,cy0+14,22,'255,180,90',.5*TFX.k);
  ctx.globalCompositeOperation='source-over';}
function fit(){const top=Math.ceil(document.getElementById('hud').getBoundingClientRect().bottom)+6,aw=innerWidth,ah=innerHeight-top-8;
  if(ZOOM){VHv=CH;VWv=Math.min(CW,Math.max(240,Math.round(CH*aw/ah)));}else{VWv=CW;VHv=CH;}
  cv.width=VWv;cv.height=VHv;dctx.imageSmoothingEnabled=false;const s=Math.min(aw/VWv,ah/VHv,3);
  cv.style.width=Math.round(VWv*s)+'px';cv.style.height=Math.round(VHv*s)+'px';cv.style.top=Math.round(top+(ah-VHv*s)/2)+'px';
  camX=clamp(PL.px+32-VWv/2,0,CW-VWv);}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function present(){const tx=clamp(PL.px+32-VWv/2,0,CW-VWv);camX+=(tx-camX)*.12;if(Math.abs(tx-camX)<.5)camX=tx;
  dctx.fillStyle='#1a110c';dctx.fillRect(0,0,VWv,VHv);dctx.drawImage(world,Math.round(camX),Math.round(camY),VWv,VHv,0,0,VWv,VHv);}
addEventListener('resize',fit);
function init(){SPR.counter=makeCounter();SPR.keitin=makeKeitin();SPR.hylly=makeHylly();SPR.stool=makeStool();SPR.pajatso=makePajatso();SPR.jukebox=makeJukebox();SPR.table=makeTable();SPR.bench=makeBench();SPR.small=makeSmallTable();SPR.tuoppi=makeTuoppi();SPR.lamp=makeLamp(0);SPR.lampS=makeLamp(1);
  buildGround();fit();hudUpd();(function loop(){update();draw();present();requestAnimationFrame(loop);})();}
init();
