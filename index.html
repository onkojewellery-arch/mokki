<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1b2620">
<title>MÖKKI</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="MÖKKI">

<style>
@font-face{font-family:'Pixelify Sans';src:url(fonts/pixelify-sans.woff2) format('woff2');font-weight:400 700;font-display:swap}
html,body{overscroll-behavior:none}
/* selkeät numerot: Jersey 10 vain numeroille, kasvatettuna kirjainten kokoon */
@font-face{font-family:'MokkiNum';src:url(fonts/jersey10.woff2) format('woff2');unicode-range:U+0030-0039;size-adjust:130%;font-display:swap}
:root{
  --bg:#1b2620; --ink:#f3ecd9; --muted:#9fb3a5;
  --btn:#34463b; --btn-hi:#4b6355; --btn-edge:#121a15;
  --a:#b8473b; --b:#4a6fa5;
  --box:#f6efdc; --box-ink:#2b2420; --box-edge:#2b2420; --box-sel:#e9dcb8;
  --s:2;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font-family:'MokkiNum','Pixelify Sans',ui-monospace,Menlo,monospace;overflow:hidden;
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#app{height:100%;max-width:560px;margin:0 auto;display:grid;
  grid-template-columns:1fr auto 1fr;grid-template-rows:auto auto 1fr;
  grid-template-areas:"head head head" "screen screen screen" "dpad mid ab";
  justify-items:center;align-items:center;gap:10px 8px;
  padding-block:max(10px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{grid-area:head;width:100%;display:flex;justify-content:space-between;align-items:baseline;color:var(--muted);font-size:13px;letter-spacing:.06em}
header b{color:var(--ink);font-weight:600;font-size:18px;letter-spacing:.25em}
#screenWrap{grid-area:screen;position:relative;background:#000;border-radius:4px;overflow:hidden;
  box-shadow:0 0 0 3px #0f1611,0 0 0 6px #3a4d42,0 14px 30px rgba(0,0,0,.45)}
#cv{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
#ui{position:absolute;inset:0;font-size:calc(var(--s)*7.5px);line-height:1.25;pointer-events:none;color:var(--box-ink)}
#ui .hide{display:none!important}
.box{position:absolute;pointer-events:auto;background:var(--box);color:var(--box-ink);
  border:calc(var(--s)*1px) solid var(--box-edge);border-radius:calc(var(--s)*2px);
  box-shadow:inset 0 0 0 calc(var(--s)*1px) #ddcfa8, 0 calc(var(--s)*1px) 0 rgba(0,0,0,.35);
  padding:calc(var(--s)*3.5px) calc(var(--s)*5px)}
#dialog{left:calc(var(--s)*3px);right:calc(var(--s)*3px);bottom:calc(var(--s)*3px);min-height:calc(var(--s)*38px)}
#dialog .t{white-space:pre-wrap}
#dialog .more{position:absolute;right:calc(var(--s)*4px);bottom:calc(var(--s)*2px);animation:bob .7s steps(2) infinite}
@keyframes bob{50%{transform:translateY(calc(var(--s)*1px))}}
.opts{list-style:none;margin:calc(var(--s)*2px) 0 0;padding:0}
.opts li{position:relative;padding:0 0 0 1.1em;cursor:pointer}
.opts li.sel::before{content:'▶';position:absolute;left:0;font-size:.8em;top:.12em}
#menu{right:calc(var(--s)*3px);top:calc(var(--s)*3px);min-width:calc(var(--s)*64px)}
#menu .opts{margin:0}
.panel{left:calc(var(--s)*3px);right:calc(var(--s)*3px);top:calc(var(--s)*3px);bottom:calc(var(--s)*3px);overflow:hidden}
.ptitle{font-weight:600;margin-bottom:calc(var(--s)*2px)}
.tasks{list-style:none;margin:0;padding:0;font-size:calc(var(--s)*6.5px)}
.tasks li{display:flex;gap:.5em;padding:calc(var(--s)*.4px) 0}
.tasks li .ck{width:1em;flex:none;color:#4f8a4a;font-weight:600}
.tasks li.done{color:#8a7f6a;text-decoration:line-through}
.bar{height:calc(var(--s)*3px);background:#ddcfa8;border-radius:9px;margin-top:calc(var(--s)*3px);overflow:hidden}
.bar i{display:block;height:100%;background:#4f8a4a}
.foot{font-size:calc(var(--s)*6px);color:#7a6f5a;margin-top:calc(var(--s)*2px)}
#hud{position:absolute;left:calc(var(--s)*3px);top:calc(var(--s)*3px);background:rgba(20,30,24,.72);color:#f3ecd9;
  padding:calc(var(--s)*1px) calc(var(--s)*3px);border-radius:calc(var(--s)*2px);font-size:calc(var(--s)*6px)}
#toast.low{top:auto;bottom:calc(var(--s)*4px)}
#hud .lv{display:flex;align-items:center;gap:calc(var(--s)*2px);margin-top:calc(var(--s)*.6px)}
#hud .xb{display:inline-block;width:calc(var(--s)*34px);height:calc(var(--s)*2.5px);background:rgba(255,255,255,.2);border-radius:9px;overflow:hidden}
#hud .xb i{display:block;height:100%;background:#a6d873}
#toast{z-index:5;position:absolute;left:50%;top:calc(var(--s)*20px);transform:translateX(-50%);max-width:92%;
  background:#2f4a3a;color:#f3ecd9;border:calc(var(--s)*1px) solid #121a15;border-radius:calc(var(--s)*2px);
  padding:calc(var(--s)*1.5px) calc(var(--s)*4px);font-size:calc(var(--s)*6.5px);text-align:center;transition:opacity .25s}
#hint{position:absolute;left:calc(var(--s)*3px);right:calc(var(--s)*3px);bottom:calc(var(--s)*3px);text-align:center;
  background:rgba(20,30,24,.82);color:#f3ecd9;border-radius:calc(var(--s)*2px);padding:calc(var(--s)*1.5px);font-size:calc(var(--s)*6px)}
/* kauppa ja mökkivihko */
.shoptop{display:flex;justify-content:space-between;align-items:center;margin-bottom:calc(var(--s)*2px)}
.tabs{display:flex;gap:calc(var(--s)*2px)}
.tab{padding:0 calc(var(--s)*3px);border-radius:calc(var(--s)*1px);cursor:pointer;color:#6a5f4c;border:calc(var(--s)*.5px) solid #c9b98f}
.tab.on{background:#3f6b4a;color:#f6efdc;border-color:#3f6b4a}
.shoplist{list-style:none;margin:0;padding:0}
.shoplist li{display:flex;justify-content:space-between;align-items:center;gap:calc(var(--s)*3px);padding:calc(var(--s)*1.1px) calc(var(--s)*2px);border-radius:calc(var(--s)*1px);cursor:pointer}
.shoplist li.sel{background:var(--box-sel)}
.shoplist small{display:block;font-size:calc(var(--s)*5.5px);color:#7a6f5a}
.pr{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.dream{margin:0 0 calc(var(--s)*2px);font-size:calc(var(--s)*6.5px)}
.ptitle.sub{margin-top:calc(var(--s)*3px);font-size:calc(var(--s)*6.5px)}
.tasks.log li{color:#5a5040}
.hin .ptitle{font-size:calc(var(--s)*8px);border-bottom:calc(var(--s)*1px) solid #3f6b4a;padding-bottom:calc(var(--s)*1px);margin-bottom:calc(var(--s)*2.5px)}
.hin .ptitle.sub{font-size:calc(var(--s)*7px);color:#3f6b4a;border-bottom:calc(var(--s)*.5px) solid #3f6b4a;text-decoration:none;margin-top:calc(var(--s)*3px);margin-bottom:calc(var(--s)*1px);padding-bottom:calc(var(--s)*.5px)}
.panel.lehti{background:#f1ece0;color:#1c1a17;border-color:#5a5448;box-shadow:inset 0 0 0 calc(var(--s)*1px) #e2dccb,0 calc(var(--s)*1px) 0 rgba(0,0,0,.35);padding:calc(var(--s)*4px) calc(var(--s)*6px) calc(var(--s)*11px)}
.lehti .mast{font-weight:700;text-align:center;font-size:calc(var(--s)*13px);letter-spacing:calc(var(--s)*.6px);line-height:1.05;border-bottom:calc(var(--s)*1.5px) solid #1c1a17;padding-bottom:calc(var(--s)*1.5px)}
.lehti .ldate{text-align:center;font-size:calc(var(--s)*5.5px);color:#4a453c;padding:calc(var(--s)*1px) 0}
.lehti .lrule{border-top:calc(var(--s)*.5px) solid #1c1a17;margin-bottom:calc(var(--s)*3px)}
.lehti .lart{margin-bottom:calc(var(--s)*5px)}
.lehti .lwide{display:block;width:100%;aspect-ratio:144/60;image-rendering:pixelated;image-rendering:crisp-edges;margin:calc(var(--s)*1.5px) 0 calc(var(--s)*1.5px);border:calc(var(--s)*.5px) solid #1c1a17}
.lehti .lrow{display:flex;align-items:center;gap:calc(var(--s)*3px);margin-bottom:calc(var(--s)*1px)}
.lehti .lrow .lh{margin:0}
.lehti .licon{width:calc(var(--s)*24px);height:calc(var(--s)*24px);flex:none;image-rendering:pixelated;image-rendering:crisp-edges}
.lehti .key{display:inline-block;min-width:1.3em;text-align:center;border-radius:50%;background:#a84a3a;color:#fff;font-weight:700;margin-right:.15em}
.lehti .key.kb{background:#4a6a9a}
.lehti .lart+.lart{border-top:calc(var(--s)*.5px) solid #8a8476;padding-top:calc(var(--s)*4px)}
.lehti .lh{font-weight:700;font-size:calc(var(--s)*7.5px);line-height:1.15;margin-bottom:calc(var(--s)*1px)}
.lehti .lart.main .lh{font-size:calc(var(--s)*10.5px);line-height:1.1}
.lehti .lt{font-size:calc(var(--s)*6.5px);color:#2e2a24}
.lehti .lfoot{position:absolute;left:calc(var(--s)*6px);right:calc(var(--s)*6px);bottom:calc(var(--s)*2.5px);display:flex;justify-content:space-between;font-size:calc(var(--s)*5.5px);color:#6a6458}
.nimiinput{width:100%;box-sizing:border-box;font:inherit;font-size:calc(var(--s)*8px);padding:calc(var(--s)*2px) calc(var(--s)*3px);border:calc(var(--s)*1px) solid var(--box-edge);border-radius:calc(var(--s)*1.5px);background:#fffaee;color:var(--box-ink);margin:calc(var(--s)*2px) 0}
.nimichips{display:flex;flex-wrap:wrap;gap:calc(var(--s)*2px);margin:calc(var(--s)*2px) 0}
.chip{display:inline-block;padding:calc(var(--s)*1px) calc(var(--s)*3px);border:calc(var(--s)*.5px) solid var(--box-edge);border-radius:calc(var(--s)*3px);background:#efe4c6;cursor:pointer;font-size:calc(var(--s)*6.5px)}
.chip.ok{background:#3f6b4a;color:#fff;font-size:calc(var(--s)*7.5px);padding:calc(var(--s)*1.5px) calc(var(--s)*6px)}
.nimiok{text-align:right;margin-top:calc(var(--s)*2px)}
.vgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:calc(var(--s)*2.5px);max-height:calc(var(--s)*92px);overflow-y:auto;padding:calc(var(--s)*1px)}
.vcard{background:#efe4c6;border:calc(var(--s)*1px) solid #cdbd98;border-radius:calc(var(--s)*2px);padding:calc(var(--s)*2px) calc(var(--s)*1.5px);text-align:center;font-size:calc(var(--s)*6px);line-height:1.1;cursor:pointer}
.vcard img{display:block;width:100%;height:calc(var(--s)*24px);object-fit:contain;image-rendering:pixelated;image-rendering:crisp-edges;margin-bottom:calc(var(--s)*1.5px)}
.vcard.sel{background:#fff8e2;border-color:#3f6b4a;box-shadow:0 0 0 calc(var(--s)*1.5px) #3f6b4a}
.vinfo{margin-top:calc(var(--s)*3px);font-size:calc(var(--s)*7px)}
.hin .tasks li{padding:calc(var(--s)*.5px) calc(var(--s)*2px);border-radius:calc(var(--s)*1px)}
.hin .tasks li:nth-child(odd){background:#efe4c6}
.hin .pr{color:#2f5a3a}
.hin .tasks.cols{display:grid;grid-template-columns:1fr 1fr;column-gap:calc(var(--s)*3px)}
.hin .tasks.cols li:nth-child(odd){background:none}
.hin .tasks.cols li:nth-child(4n+1),.hin .tasks.cols li:nth-child(4n+2){background:#efe4c6}
.hin .tab2{display:flex;gap:calc(var(--s)*2px);margin-bottom:calc(var(--s)*2px)}
.hin .tab2 span{padding:0 calc(var(--s)*3px);border-radius:calc(var(--s)*1px);color:#6a5f4c;border:calc(var(--s)*.5px) solid #c9b98f}
.hin .tab2 span.on{background:#3f6b4a;color:#f6efdc;border-color:#3f6b4a}
/* title */
#title{position:absolute;inset:0;pointer-events:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:linear-gradient(180deg,rgba(20,30,24,.15),rgba(20,30,24,.75) 70%)}
#title .logo{font-size:calc(var(--s)*26px);font-weight:600;color:#f6efdc;letter-spacing:.12em;
  text-shadow:0 calc(var(--s)*1px) 0 #2b2420,calc(var(--s)*1px) 0 0 #2b2420,calc(var(--s)*-1px) 0 0 #2b2420,0 calc(var(--s)*-1px) 0 #2b2420,0 calc(var(--s)*3px) 0 #a63c32}
#title .sub{color:#f3ecd9;font-size:calc(var(--s)*6.5px);margin:calc(var(--s)*2px) 0 calc(var(--s)*8px);opacity:.9}
#title .tbox{position:relative}
#title .warn{font-size:calc(var(--s)*6px);margin-bottom:calc(var(--s)*1px)}
/* customization */
.custom{font-size:calc(var(--s)*6.5px)}
.cgrid{display:flex;gap:calc(var(--s)*4px)}
.cleft{display:flex;flex-direction:column;align-items:center;gap:calc(var(--s)*2px)}
#portrait{width:calc(var(--s)*40px);height:calc(var(--s)*40px);image-rendering:pixelated;border:calc(var(--s)*1px) solid var(--box-edge);border-radius:calc(var(--s)*1px)}
#mini{width:calc(var(--s)*19px);height:calc(var(--s)*29px);image-rendering:pixelated}
.crows{list-style:none;margin:0;padding:0;flex:1;min-width:0}
.crows li{display:flex;align-items:center;padding:calc(var(--s)*.9px) calc(var(--s)*1.5px);border-radius:calc(var(--s)*1px);cursor:pointer}
.crows li.sel{background:var(--box-sel)}
.crows .lab{flex:1;color:#6a5f4c}
.crows .arr{padding:0 calc(var(--s)*1.5px);cursor:pointer}
.crows .val{min-width:calc(var(--s)*36px);text-align:center}
.namerow{display:flex;align-items:center;gap:calc(var(--s)*3px);margin-bottom:calc(var(--s)*2px);color:#6a5f4c}
.namerow input{flex:1;min-width:0;font:inherit;color:var(--box-ink);background:#fffaee;border:calc(var(--s)*.5px) solid #c9b98f;border-radius:calc(var(--s)*1px);padding:calc(var(--s)*.8px) calc(var(--s)*2px);user-select:text;-webkit-user-select:text;touch-action:auto}
.crows li.done{justify-content:center;font-weight:600;margin-top:calc(var(--s)*2px)}
/* controls */
#dpad{grid-area:dpad;position:relative;width:114px;height:114px;touch-action:none}
#dpad span{position:absolute;width:38px;height:38px;background:var(--btn);box-shadow:0 4px 0 var(--btn-edge)}
#dpad .u{left:38px;top:0;border-radius:8px 8px 0 0}
#dpad .d{left:38px;top:76px;border-radius:0 0 8px 8px}
#dpad .l{left:0;top:38px;border-radius:8px 0 0 8px}
#dpad .r{left:76px;top:38px;border-radius:0 8px 8px 0}
#dpad .c{left:38px;top:38px}
#dpad span::after{content:'';position:absolute;left:50%;top:50%;border:7px solid transparent;transform:translate(-50%,-50%)}
#dpad .u::after{border-bottom-color:#7f978a;margin-top:-4px}
#dpad .d::after{border-top-color:#7f978a;margin-top:4px}
#dpad .l::after{border-right-color:#7f978a;margin-left:-4px}
#dpad .r::after{border-left-color:#7f978a;margin-left:4px}
#dpad .c::after{display:none}
#dpad[data-dir=up] .u,#dpad[data-dir=down] .d,#dpad[data-dir=left] .l,#dpad[data-dir=right] .r{background:var(--btn-hi);transform:translateY(2px);box-shadow:0 2px 0 var(--btn-edge)}
#mid{grid-area:mid;display:flex;flex-direction:column;align-items:center;gap:8px}
.pill{font:inherit;font-size:12px;letter-spacing:.12em;color:var(--ink);background:var(--btn);border:0;border-radius:99px;padding:8px 14px;box-shadow:0 3px 0 var(--btn-edge);touch-action:none}
.hint2{font-size:10px;color:var(--muted);text-align:center;max-width:96px;line-height:1.3}
@media (pointer:coarse){.hint2{display:none}}
#ab{grid-area:ab;position:relative;width:114px;height:104px}
.round{position:absolute;width:54px;height:54px;border-radius:50%;border:0;font:inherit;font-weight:600;font-size:20px;color:#fff;touch-action:none;box-shadow:0 4px 0 var(--btn-edge)}
.round.a{right:0;top:0;background:var(--a)}
.round.b{left:0;top:48px;background:var(--b)}
.round.on,.pill.on{transform:translateY(2px);box-shadow:0 2px 0 var(--btn-edge);filter:brightness(1.15)}
@media (orientation:landscape) and (max-height:560px){
  #app{max-width:none;grid-template-columns:auto 1fr auto;grid-template-rows:1fr auto;
    grid-template-areas:"dpad screen ab" "dpad screen mid";padding:10px max(16px,env(safe-area-inset-left))}
  header{display:none}
  .hint2{display:none}
}
</style>
</head>
<body>
<div id="app">
  <header><b>MÖKKI</b></header>
  <div id="screenWrap">
    <canvas id="cv" width="320" height="288"></canvas>
    <div id="ui">
      <div id="hud" class="hide"></div>
      <div id="toast" class="hide"></div>
      <div id="hint" class="hide"></div>
      <div id="title" class="hide">
        <div class="logo">MÖKKI</div>
        <div class="sub">mummon mökki · versio 0.23</div>
        <div class="box tbox"><div class="warn hide"></div><ul class="opts" id="tmenu"></ul></div>
      </div>
      <div id="dialog" class="box hide"><div class="t"></div><ul class="opts"></ul><span class="more">▼</span></div>
      <div id="menu" class="box hide"><ul class="opts"></ul></div>
      <div id="panel" class="box panel hide"></div>
      <div id="custom" class="box panel custom hide">
        <div class="ptitle"></div>
        <label class="namerow">Nimi <input id="pname" maxlength="22" autocomplete="off" spellcheck="false"></label>
        <div class="cgrid">
          <div class="cleft"><canvas id="portrait" width="40" height="40"></canvas><canvas id="mini" width="38" height="58"></canvas></div>
          <ul class="crows"></ul>
        </div>
      </div>
    </div>
  </div>
  <div id="dpad" aria-label="Suuntaohjain"><span class="u"></span><span class="l"></span><span class="c"></span><span class="r"></span><span class="d"></span></div>
  <div id="mid"><button id="bStart" class="pill">VALIKKO</button><div class="hint2">Näppäimistöllä: nuolet, z = A, x = B, Enter = valikko</div></div>
  <div id="ab"><button id="bB" class="round b">B</button><button id="bA" class="round a">A</button></div>
</div>

<script>
'use strict';
/* ============================================================
   MÖKKI – prototyyppi 0.1
   Yksi tiedosto: grafiikka piirretään koodilla pikseleinä.
   ============================================================ */
const TS=32,VW=320,VH=288;
const cv=document.getElementById('cv'); const ctx=cv.getContext('2d'); ctx.imageSmoothingEnabled=false;
const $=s=>document.querySelector(s);

/* ---------- apufunktiot ---------- */
function mk(w,h,fn){const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');g.imageSmoothingEnabled=false;if(fn)fn(g,w,h);return c;}
function R(g,x,y,w,h,c){g.fillStyle=c;g.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h));}
function P(g,x,y,c){g.fillStyle=c;g.fillRect(Math.round(x),Math.round(y),1,1);}
function box(g,x,y,w,h,fill,edge){R(g,x,y,w,h,edge||C.out);R(g,x+1,y+1,w-2,h-2,fill);}
function hash(x,y,s){let h=(x*374761393+y*668265263+(s||0)*1442695041)|0;h=Math.imul(h^(h>>>13),1274126177);return ((h^(h>>>16))>>>0)/4294967296;}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function hexRgb(h){const n=parseInt(h.slice(1),16);return [n>>16,(n>>8)&255,n&255];}
function shade(hex,f){let [r,g,b]=hexRgb(hex);
  if(f<1){r*=f;g*=f;b*=f}else{r+=(255-r)*(f-1);g+=(255-g)*(f-1);b+=(255-b)*(f-1)}
  return '#'+[r,g,b].map(v=>clamp(Math.round(v),0,255).toString(16).padStart(2,'0')).join('');}

/* ---------- tikkataulu ---------- */
const DARTS=[];
function throwDarts(){const sc=[];DARTS.length=0;const cols=['#e8443a','#f4d35e','#4a8ae0'];
  for(let i=0;i<3;i++){const r=Math.random();let p,rad;
    if(r<.06){p=50;rad=0;}else if(r<.16){p=25;rad=1.5;}else if(r<.88){p=1+Math.floor(Math.random()*20);rad=2.5+Math.random()*2.5;}else{p=0;rad=8.5;}
    const an=Math.random()*Math.PI*2;DARTS.push([Math.round(Math.cos(an)*rad),Math.round(Math.sin(an)*rad),cols[i]]);sc.push(p);
    setTimeout(()=>blip(p?500+p*8:180,.05,'square',.02),i*180);}
  const tot=sc.reduce((a,b)=>a+b,0),best=S.flags.tikkaEnnatys||0;
  const pg=['Heität kolme tikkaa: '+sc.map(v=>v===0?'ohi':v===50?'napakymppi 50':v).join(' + ')+'.'];
  if(tot>best){S.flags.tikkaEnnatys=tot;save();pg.push('Yhteensä '+tot+' pistettä. Uusi ennätys!');}else pg.push('Yhteensä '+tot+' pistettä. Ennätys on '+best+'.');
  say(pg);}

function curLevel(){return Math.max(S.taso||1,levelFor(S.xp||0));}
function levelProgress(){const L=curLevel();if(L>=XP_LEVELS.length)return [L,1,null];const lo=XP_LEVELS[L-1],hi=XP_LEVELS[L];return [L,clamp(((S.xp||0)-lo)/(hi-lo),0,1),hi];}
function award(key,amt,label){S.xpGot=S.xpGot||{};if(S.xpGot[key])return;S.xpGot[key]=true;const before=curLevel();
  S.xp=(S.xp||0)+amt;S.taso=Math.max(S.taso||1,levelFor(S.xp));toast('+'+amt+' XP · '+label);
  const after=curLevel();if(after>=3&&before<3)setTimeout(()=>toast('Vattulan Sanomissa on uutisia rantamökistä'),2500);if(after>before){toast('Mökkitaso '+after+'!');setTimeout(jingle,300);addLog('Mökkitaso nousi tasolle '+after+'.');}save();hud();}

function gameNow(){return S.day*1440+S.time;}
function isNight(){return S.time<420||S.time>=1320;}

function stageOf(pl){if(pl.p==null)return pl.st||0;return Math.max(0,Math.min(3,Math.floor((gameNow()-pl.p)/(GROW[pl.t]||900)*3)));}

  return N+' kasvaa · valmis '+(d===S.day?'klo ':d===S.day+1?'huomenna klo ':'päivänä '+d+' klo ')+hh+' (n. '+left+' min)';}

  if(po.side==='etu')return {'10,7':'Oven eteen pitää jättää tilaa.','10,8':P2,'8,7':'Kukkaruukku on tiellä.','12,7':'Kuistin penkki on tiellä.'};

  if(D.ctx==='tupa'){const rug=f.t==='matto';
    for(let y=f.y;y<f.y+h;y++)for(let x=f.x;x<f.x+w;x++){
      if(rug){if(S.furn.some(g=>g!==D.src&&g.t==='matto'&&(()=>{const [gw,gh]=dims(g);return x>=g.x&&x<g.x+gw&&y>=g.y&&y<g.y+gh;})()))return 'Matto ei mahdu toisen maton päälle.';continue;}

function decorHint(){const D=decor;if(!D)return;

function drawObj(o){if(o.tf&&decor&&decor.held&&decor.src===o.ref)return;if(o.k==='raimo'&&!raimoOut())return;if(o.k==='puomi'&&puomiAuki())return;if(o.k==='jänis')return;const c=sprFor(o);if(!c)return;drawSpr(c,o);
  if(o.tikka){const [x0,y0]=sprPos(c,o),bx=x0+35,by=y0+72;P(ctx,bx,by-9,'#8a8e98');
    ell(ctx,bx,by,7,7,'#2a2320');ell(ctx,bx,by,6,6,'#1f5a3a');ell(ctx,bx,by,5,5,'#e8dcc0');ell(ctx,bx,by,4,4,'#c0443a');ell(ctx,bx,by,3,3,'#e8dcc0');ell(ctx,bx,by,2,2,'#1f5a3a');P(ctx,bx,by,'#c0443a');
    for(let a=0;a<8;a++){const an=a/8*Math.PI*2;P(ctx,bx+Math.round(Math.cos(an)*5),by+Math.round(Math.sin(an)*5),'#2a2320');}

    for(const sx of [10,21]){R(ctx,x+sx,y+10,10,4,'#7a2e1c');R(ctx,x+sx,y+10,10,1,'#c05a30');P(ctx,x+sx+3,y+11,'#e08a58');}}}
function drawPlayer(){if(!CH)return;const prog=Math.abs(PL.px-PL.x*TS)+Math.abs(PL.py-PL.y*TS);
  const fi=PL.moving&&prog<16?(PL.parity?1:2):0;const x=Math.round(PL.px),y=Math.round(PL.py);
  ell(ctx,x+17,y+29,10,2,'rgba(14,52,70,.35)');const blink=!PL.moving&&PL.dir!=='up'&&(frame%250)<7;ctx.drawImage(CH[PL.dir][blink?3:fi],x-3,y-24);}
function draw(){
  ctx.fillStyle='#10160f';ctx.fillRect(0,0,VW,VH);
  const sc=S.scene,mapW=sc!=='tupa'?YW*TS:VW,mapH=sc!=='tupa'?YH*TS:VH;

  if(mode==='terrace'&&terr){fx=(terr.rect.x+terr.rect.w/2)*TS;fy=(terr.rect.y+terr.rect.h/2)*TS;}
  if(mode==='paint'){fx=10*TS+16;fy=5*TS+16;}

  camX=Math.round(clamp(fx-VW/2,0,mapW-VW));camY=Math.round(clamp(fy-VH/2,0,mapH-VH));
  if(groundDirty)rebuildGround();
  ctx.drawImage(ground,-camX,-camY);
  ctx.save();ctx.translate(-camX,-camY);
  if(sc==='tupa'&&S.radioOn){R(ctx,43,12,6,3,'#ffd060');R(ctx,43,12,6,1,'#fff0a0');P(ctx,44+((frame>>5)%4),13,'#c0443a');
    const t=frame%90;if(t<60){const nx=40+Math.round(Math.sin(t/9)*3),ny=8-Math.floor(t/6);ctx.globalAlpha=1-t/60;R(ctx,nx,ny,2,2,'#2a2320');R(ctx,nx+1,ny-4,1,4,'#2a2320');P(ctx,nx+2,ny-4,'#2a2320');ctx.globalAlpha=1;}}
  if(sc==='kyla'){for(let i=0;i<40;i++){if(((frame>>3)+i*7)%23>2)continue;const x=Math.floor(hash(i,1,300)*YW*TS),sy=kylaShoreY(x)+16,y=Math.floor(sy+hash(i,2,300)*(YH*TS-sy-8));R(ctx,x,y,3,1,'#ffffff');P(ctx,x+1,y-1,'#e6f6fc');}}
  const list=[];
  if(sc!=='tupa'){if(sc==='piha'){drawPlants();drawTallGrass();}for(const o of YOBJ)list.push({y:(o.y+o.h)*TS,d:()=>drawObj(o)});}
  else{for(const f of S.furn){if(decor&&decor.held&&decor.src===f)continue;if(f.t==='matto')drawFurn(ctx,f,f.x*TS,f.y*TS);
    else list.push({y:(f.y+dims(f)[1])*TS,d:()=>drawFurn(ctx,f,f.x*TS,f.y*TS)});}}
  if(!(mode==='title'&&sc==='piha'))list.push({y:PL.py+TS+.5,d:drawPlayer});if(sc==='polku'&&HARE)list.push({y:(HARE.row+1)*TS-1,d:drawHare});
  list.sort((a,b)=>a.y-b.y).forEach(o=>o.d());
  if(sc==='piha'){const w=(frame>>3)%2,bx=Math.round(BF.x),by=Math.round(BF.y);P(ctx,bx,by,'#2a1d24');P(ctx,bx,by+1,'#2a1d24');
    if(w){R(ctx,bx-3,by-2,3,3,'#fff6e8');R(ctx,bx+1,by-2,3,3,'#fff6e8');P(ctx,bx-3,by-2,'#f4c8d8');}else{R(ctx,bx-1,by-3,1,3,'#fff6e8');R(ctx,bx+1,by-3,1,3,'#fff6e8');}}
  for(const p of PARTS){const t=p.life/p.max;
    if(p.fly){if(S.scene==='tupa')continue;ctx.globalAlpha=((p.life>>3)%5===0)?.35:Math.max(0,Math.min(1,p.life/40,(p.max-p.life)/40));R(ctx,p.x,p.y,2,2,p.c);continue;}
    if(p.leaf){ctx.globalAlpha=Math.max(0,Math.min(1,(1-t)*3));R(ctx,p.x,p.y,3,2,p.c);P(ctx,p.x+((p.life>>4)%2?2:0),p.y+2,'#6b8a30');continue;}
    if(p.smoke){ctx.globalAlpha=Math.max(0,(1-t)*.5);const s=2+Math.floor(t*5);R(ctx,p.x,p.y,s,s,p.c);continue;}
    ctx.globalAlpha=Math.max(0,1-t);R(ctx,p.x,p.y,2,2,p.c);}
  ctx.globalAlpha=1;
  if(mode==='decor'&&decor){const D=decor,blink=(frame>>4)%2;
    if(D.ctx==='terassi'){const r=terraceRect(S.porch);ctx.strokeStyle='rgba(255,255,255,.55)';ctx.lineWidth=1;ctx.setLineDash([4,3]);ctx.strokeRect(r.x*TS+.5,r.y*TS+.5,r.w*TS-1,r.h*TS-1);ctx.setLineDash([]);
      for(const k in terraceReserved()){const [qx,qy]=k.split(',').map(Number);ctx.fillStyle='rgba(255,90,70,.16)';ctx.fillRect(qx*TS+2,qy*TS+2,TS-4,TS-4);}}
    if(D.held){const ok=!placeReason(D.held);ctx.globalAlpha=.85;if(D.ctx==='tupa')drawFurn(ctx,D.held,D.held.x*TS,D.held.y*TS);else{const sp=sprFor({k:D.held.t,ref:D.held});const [x0,y0]=sprPos(sp,{x:D.held.x,y:D.held.y,w:1,h:1});ctx.drawImage(sp,x0,y0);}ctx.globalAlpha=1;
      const [w,h]=dims(D.held);ctx.fillStyle=ok?'rgba(120,220,120,.22)':'rgba(255,70,60,.35)';ctx.fillRect(D.held.x*TS,D.held.y*TS,w*TS,h*TS);
      ctx.strokeStyle=ok?'#bff5a8':'#ff8a80';ctx.lineWidth=2;ctx.strokeRect(D.held.x*TS+1,D.held.y*TS+1,w*TS-2,h*TS-2);}
    else{const X=D.cx*TS,Y=D.cy*TS,c=blink?'#ffffff':'#f4d35e';
      R(ctx,X,Y,8,2,c);R(ctx,X,Y,2,8,c);R(ctx,X+24,Y,8,2,c);R(ctx,X+30,Y,2,8,c);
      R(ctx,X,Y+30,8,2,c);R(ctx,X,Y+24,2,8,c);R(ctx,X+24,Y+30,8,2,c);R(ctx,X+30,Y+24,2,8,c);}}
  if(mode==='terrace'&&terr){const r=terr.rect;if(S.porch){const p=S.porch;ctx.fillStyle='rgba(255,255,255,.12)';ctx.fillRect(p.x*TS,p.y*TS,p.w*TS,p.h*TS);}ctx.globalAlpha=.85;drawPorch(ctx,{side:terr.side,x:r.x,y:r.y,w:r.w,h:r.h,terrace:true});ctx.globalAlpha=1;
    for(const q of terr.blocked){ctx.fillStyle='rgba(255,60,50,.4)';ctx.fillRect(q.x*TS,q.y*TS,TS,TS);}if(S.porch){const p=S.porch;ctx.strokeStyle='rgba(255,255,255,.9)';ctx.lineWidth=1;ctx.setLineDash([4,3]);ctx.strokeRect(p.x*TS+3.5,p.y*TS+3.5,p.w*TS-7,p.h*TS-7);ctx.setLineDash([]);}
    ctx.strokeStyle=(frame>>4)%2?'#ffffff':'#f4d35e';ctx.lineWidth=2;ctx.strokeRect(r.x*TS+1,r.y*TS+1,r.w*TS-2,r.h*TS-2);}
  if(mode==='build'&&build){const c=build.cands[build.i];ctx.globalAlpha=.8;drawPorch(ctx,c);ctx.globalAlpha=1;
    ctx.strokeStyle=(frame>>4)%2?'#ffffff':'#f4d35e';ctx.lineWidth=2;ctx.strokeRect(c.x*TS+1,c.y*TS+1,c.w*TS-2,c.h*TS-2);}
  ctx.restore();
  drawLighting();
  if(VIGN)ctx.drawImage(VIGN,0,0);
  if(fade){ctx.fillStyle='rgba(14,18,16,'+clamp(fade.a,0,1)+')';ctx.fillRect(0,0,VW,VH);}
  if(mode==='custom'&&CH){const dirs=['down','left','up','right'];const d=dirs[(frame>>6)%4];
    mctx.clearRect(0,0,38,58);mctx.drawImage(CH[d][(frame>>3)%2?1:2],0,0);}}

const TALL=[[100,428],[180,472],[294,348],[378,312],[84,248],[548,444],[248,220],[392,372],[40,360],[568,240]];
function drawTallGrass(){for(let i=0;i<TALL.length;i++){const [x,y]=TALL[i],sw=Math.sin(frame/95+i*1.7);
  for(let b=0;b<6;b++){const bx=x+b*2-6,h=13+((i+b)%3)*4,lean=b-2.5;
    for(let k=0;k<h;k++){const t=k/h,dx=Math.round(lean*t*.7+sw*t*t*3);P(ctx,bx+dx,y-k,k<3?GRASS[1]:k<h-4?GRASS[3]:GRASS[4]);}
    if(b%2===0){const tx=bx+Math.round(lean*.7+sw*3),ty=y-h;R(ctx,tx,ty-2,1,3,'#d8c486');P(ctx,tx,ty-3,'#f0e2b0');}}}}
/* ---------- vuorokausi ja valaistus ---------- */
function clockStr(){const t=S.time||0;return Math.floor(t/60)+'.'+String(t%60).padStart(2,'0');}
function pickTime(){ask('Hyppää kellonaikaan (testiä varten)',['Aamu 7.00','Päivä 13.00','Kultainen ilta 19.30','Hämärä 21.30','Yö 23.30','Peru'],i=>{const TT=[420,780,1170,1290,1410];if(i<5){S.time=TT[i];hud();save();}});}
const AMB=[[0,'#4a5490'],[300,'#5660a0'],[360,'#9a8cc0'],[420,'#ffd9b8'],[540,'#fff6e6'],[960,'#fff2e0'],[1110,'#ffd6a4'],[1230,'#eea08a'],[1320,'#7a72b0'],[1380,'#5660a0'],[1440,'#4a5490']];
function lerpHex(a,b,t){const A=hexRgb(a),B=hexRgb(b);return A.map((v,i)=>Math.round(v+(B[i]-v)*t));}
function ambientAt(m){for(let i=0;i<AMB.length-1;i++){const [t0,c0]=AMB[i],[t1,c1]=AMB[i+1];if(m>=t0&&m<=t1)return lerpHex(c0,c1,(m-t0)/((t1-t0)||1));}return hexRgb(AMB[0][1]);}
function darkness(rgb){return clamp(1-(rgb[0]*.3+rgb[1]*.55+rgb[2]*.15)/235,0,1);}
function lightSources(){const L=[];
  if(S.scene!=='tupa'){for(const o of YOBJ){
      if(o.k==='house'||o.k==='house2'){const [x0,y0]=sprPos(sprFor(o),o);for(const wx of [22,108])L.push({x:x0+wx+18,y:y0+86,r:48,c:'255,200,120',win:[x0+wx+6,y0+75,24,22]});L.push({x:x0+102,y:y0+83,r:56,c:'255,214,140'});}
      else if(o.k==='grilli'){const [x0,y0]=sprPos(SPR.grilli,o);L.push({x:x0+92,y:y0+92,r:60,c:'255,200,120',win:[x0+70,y0+78,46,22]});L.push({x:x0+40,y:y0+60,r:40,c:'255,120,90'});}
      else if(o.k==='shop'){const [x0,y0]=sprPos(SPR.shop,o),WY=y0+50;L.push({x:x0+97,y:WY+48,r:64,c:'255,205,130',win:[x0+72,WY+36,50,24]});L.push({x:x0+51,y:WY+23,r:40,c:'255,214,140'});}
      else if(o.k==='lamp'){const [x0,y0]=sprPos(SPR.lamp,o);L.push({x:x0+15,y:y0+18,r:88,c:'255,220,150'});}
      else if(o.k==='grill'&&grilling>0)L.push({x:o.x*TS+16,y:o.y*TS+8,r:52,c:'255,140,60'});}}
  else{if(S.radioOn)L.push({x:46,y:14,r:26,c:'255,210,120'});const h=S.furn.find(f=>f.t==='hella');if(h)L.push({x:h.x*TS+16,y:h.y*TS+16,r:72,c:'255,150,70'});
    const pt=S.furn.find(f=>f.t==='poyta');if(pt){const [w,hh]=dims(pt);L.push({x:pt.x*TS+w*16,y:pt.y*TS+hh*16-8,r:92,c:'255,214,150'});}}
  for(const q of PARTS)if(q.fly&&S.scene!=='tupa')L.push({x:q.x,y:q.y,r:14,c:'220,255,140'});
  if(HARE&&S.scene==='polku')L.push({x:HARE.x,y:HARE.y-2,r:28,c:'200,210,245'});
  return L;}
let LM=null;
function drawLighting(){
  const out=ambientAt(S.time),odk=darkness(out);
  let amb=S.scene==='tupa'?lerpHex('#fff2e0','#7e7092',clamp(odk*1.15,0,1)):S.scene==='jaska'?lerpHex('#fff0dc','#c4a890',clamp(odk,0,1)):out;if(FOREST_SC[S.scene])amb=amb.map((v,i)=>Math.round(v*[.88,.94,.9][i]));const dk=darkness(amb);
  if(S.scene==='tupa'){const k=1-odk*.5;ctx.globalCompositeOperation='multiply';ctx.fillStyle='rgb('+out.map(v=>Math.round(v*k)).join(',')+')';for(const wx of [72,200])ctx.fillRect(wx+4,10,40,36);ctx.globalCompositeOperation='source-over';
    if(odk>.3){ctx.fillStyle='rgba(255,255,230,'+Math.min(1,(odk-.3)*2)+')';for(const [x,y] of [[78,12],[83,16],[112,13],[116,19],[204,12],[218,14],[229,11],[240,17]])ctx.fillRect(x,y,1,1);
      ctx.fillStyle='rgba(240,240,220,'+Math.min(.9,(odk-.3)*1.8)+')';ctx.fillRect(237,12,3,3);ctx.fillRect(236,13,1,1);
      ctx.fillStyle='rgba(190,200,230,'+Math.min(.55,(odk-.3)*1.2)+')';ctx.fillRect(98,16,3,10);ctx.fillRect(98,28,3,18);}}
  if(!LM)LM=mk(VW,VH,()=>{});const g=LM.getContext('2d');
  g.globalCompositeOperation='source-over';g.fillStyle='rgb('+amb.join(',')+')';g.fillRect(0,0,VW,VH);
  const L=lightSources();
  if(dk>.05){g.globalCompositeOperation='lighter';
    for(const l of L){const x=l.x-camX,y=l.y-camY;if(x<-120||y<-120||x>VW+120||y>VH+120)continue;const gr=g.createRadialGradient(x,y,0,x,y,l.r);
      gr.addColorStop(0,'rgba('+l.c+','+(.95*dk)+')');gr.addColorStop(1,'rgba('+l.c+',0)');g.fillStyle=gr;g.fillRect(x-l.r,y-l.r,l.r*2,l.r*2);}}
  ctx.globalCompositeOperation='multiply';ctx.drawImage(LM,0,0);
  if(dk>.25){ctx.globalCompositeOperation='lighter';const a=(dk-.25)/.75;
    for(const l of L){if(l.win){ctx.fillStyle='rgba(255,180,80,'+(.6*a)+')';ctx.fillRect(l.win[0]-camX,l.win[1]-camY,l.win[2],l.win[3]);}
      const x=l.x-camX,y=l.y-camY,r=l.r*.55,gr=ctx.createRadialGradient(x,y,0,x,y,r);gr.addColorStop(0,'rgba('+l.c+','+(.25*a)+')');gr.addColorStop(1,'rgba('+l.c+',0)');ctx.fillStyle=gr;ctx.fillRect(x-r,y-r,r*2,r*2);}}
  ctx.globalCompositeOperation='source-over';}
function makeVignette(){VIGN=mk(VW,VH,g=>{const gr=g.createRadialGradient(VW/2,VH/2,110,VW/2,VH/2,230);gr.addColorStop(0,'rgba(70,40,30,0)');gr.addColorStop(1,'rgba(70,40,30,.14)');g.fillStyle=gr;g.fillRect(0,0,VW,VH);});}

/* ---------- asettelu ---------- */
function layout(){const wrap=$('#screenWrap');const land=innerWidth>innerHeight&&innerHeight<=560;
  let aw,ah;if(land){aw=innerWidth-2*130-40;ah=innerHeight-24;}else{aw=Math.min(innerWidth,560)-32;ah=innerHeight-60-170-30;}
  let s=Math.min(aw/160,ah/144);if(s>=2)s=Math.floor(s);s=clamp(s,1,5);
  wrap.style.width=160*s+'px';wrap.style.height=144*s+'px';$('#ui').style.setProperty('--s',s);}
addEventListener('resize',layout);addEventListener('orientationchange',()=>setTimeout(layout,100));

/* ---------- käynnistys ---------- */
makeSprites();makeVignette();CH=buildChar(S.look);layout();renderTitle();hud();
setInterval(()=>{if(mode==='world')save();},10000);
document.addEventListener('visibilitychange',()=>{if(document.hidden)save();});
let last=0,acc=0;const STEP=1000/60;
function loop(t){if(!last)last=t;acc+=Math.min(100,t-last);last=t;while(acc>=STEP){update();acc-=STEP;}draw();requestAnimationFrame(loop);}
requestAnimationFrame(loop);
